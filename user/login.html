<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Masuk — Malzz Chat</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#6c5ce7" />
<link rel="stylesheet" href="./style.css" />
</head>
<body data-page="login">
<div class="auth-shell fade-in">
  <div class="auth-logo">
    <div class="logo">M</div>
    <h1>Malzz Chat</h1>
    <p>Ngobrol tanpa batas, aman dan elegan.</p>
  </div>

  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required placeholder="nama@email.com" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="flex-between mt-8" style="margin-bottom:14px;">
      <span></span>
      <a href="#" id="forgotLink" class="small" style="color:var(--accent); font-weight:600;">Lupa password?</a>
    </div>
    <button class="btn ripple" type="submit" id="loginBtn"><span id="loginBtnLabel">Masuk</span></button>
  </form>

  <div class="divider">atau</div>

  <button class="btn secondary ripple" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 15.6 3 8.4 7.8 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.2-2 13.9-5.4l-6.4-5.3C29.4 36 26.9 37 24 37c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C8.3 40.1 15.6 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.6-6.2 7.2l6.4 5.3C39.6 37 43 31.4 43 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Masuk dengan Google
  </button>

  <p class="link-row">Belum punya akun? <a href="./register.html">Daftar sekarang</a></p>
  <p class="small center mt-8">© 2026 Malzz. All Rights Reserved.</p>
</div>

<script type="module">
import { loginWithEmail, loginWithGoogle, resetPassword, toast, friendlyFirebaseError, registerServiceWorker } from "./app.js";
import { auth } from "../firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

registerServiceWorker();

onAuthStateChanged(auth, (user) => { if (user) window.location.replace("./index.html"); });

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const label = document.getElementById("loginBtnLabel");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  label.innerHTML = '<span class="spinner"></span>';
  try {
    await loginWithEmail(document.getElementById("email").value.trim(), document.getElementById("password").value);
    window.location.replace("./index.html");
  } catch (err) {
    toast(friendlyFirebaseError(err), "error");
    btn.disabled = false;
    label.textContent = "Masuk";
  }
});

document.getElementById("googleBtn").addEventListener("click", async () => {
  try {
    await loginWithGoogle();
    window.location.replace("./index.html");
  } catch (err) {
    toast(friendlyFirebaseError(err), "error");
  }
});

document.getElementById("forgotLink").addEventListener("click", async (e) => {
  e.preventDefault();
  const email = prompt("Masukkan email untuk reset password:");
  if (!email) return;
  try {
    await resetPassword(email.trim());
    toast("Link reset password telah dikirim ke email kamu.", "success");
  } catch (err) {
    toast(friendlyFirebaseError(err), "error");
  }
});
</script>
</body>
</html>
